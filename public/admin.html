<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#FF5A1F">
<style>body{font:16px/1.6 system-ui;max-width:800px;margin:auto;padding:16px}input,textarea,select,button{font:inherit;padding:12px;border:2px solid #111;width:100%;margin:4px 0;background:#fff;min-height:44px}button{background:#FF5A1F;font-weight:600;cursor:pointer;width:auto}.c{border:2px solid #111;padding:12px;margin:10px 0}h2{margin-top:32px}.m{color:#444;font-size:14px}</style></head><body>
<h1>Studio</h1><p class="m">Tip: Chrome menu (⋮) → "Add to Home screen" to open Studio like an app.</p>
<input id="k" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="sessionStorage.k=k.value;load()">Open</button>
<h2>New post</h2><form id="f"><select name="kind"><option value="post">Home post</option><option value="gallery">Gallery</option><option value="contribution">Contribution</option></select><input name="title" placeholder="Title" required><textarea name="body" rows="4" placeholder="Write..."></textarea><input type="file" id="media" multiple accept="image/*,audio/*"><p class="m">Photos are resized automatically. For videos, post the YouTube link in the text.</p><label><input type="checkbox" name="social" value="1" style="width:auto;min-height:0"> Also post to social media</label><button>Go live</button></form>
<h2>Waiting for approval</h2><div id="q"></div><h2>Messages</h2><div id="m"></div>
<h2>Edit site text and links</h2><div id="tx"></div><h2>Change site photos</h2><div id="im"></div>
<script>
const H=()=>({'x-admin-key':sessionStorage.k||''});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TX=[['philosophy','Home: philosophy of life and work'],['story1','About: story 1'],['story2','About: story 2'],['fb','Facebook link'],['li','LinkedIn link'],['ig','Instagram link'],['yt','YouTube link']];
const IM=[['img_bajao','Bajao poster'],['img_munnes','Munnes poster'],['img_crimepatrol','Crime Patrol photo'],['img_crimealert','Crime Alert photo'],['img_vertical','Vertical dramas photo'],['img_ads','Ads and music videos photo']];
function shrink(file){return new Promise(r=>{if(!file.type.startsWith('image/'))return r(file);const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(new File([b],file.name.replace(/\.\w+$/,'.jpg'),{type:'image/jpeg'})),'image/jpeg',.8)};i.src=URL.createObjectURL(file)})}
async function load(){const r=await fetch('/api/admin',{headers:H()});if(!r.ok){q.textContent='Wrong password';return}const d=await r.json();
const C=(await (await fetch('/api/public')).json()).content||{};
q.innerHTML=d.comments.map(c=>`<div class=c><b>${esc(c.name)}</b>: ${esc(c.body)}<br><button onclick="act('approve','comments','${c.id}')">Approve</button> <button onclick="act('delete','comments','${c.id}')">Delete</button></div>`).join('')+(d.likes.length?`<div class=c>${d.likes.length} likes waiting <button onclick='likes(${JSON.stringify(d.likes.map(l=>l.id))})'>Approve all</button></div>`:'')||'Nothing waiting.';
m.innerHTML=d.inbox.map(x=>`<div class=c><b>${esc(x.kind)}</b> ${esc(x.name)} · ${esc(x.phone||'')} · ${esc(x.email||'')}<br>${esc(x.title||'')} ${esc(x.message||'')} ${x.file_url?`<a href="${x.file_url}">file</a>`:''}<br><textarea id="r${x.id}" rows=2 placeholder="Reply"></textarea><button onclick="rep('${x.id}')">${x.replied?'Replied. Send again':'Send reply'}</button></div>`).join('');
tx.innerHTML=TX.map(([k,l])=>`<div class=c><b>${l}</b><textarea id="t_${k}" rows=3>${esc(C[k]||'')}</textarea><button onclick="saveT('${k}')">Save</button></div>`).join('');
im.innerHTML=IM.map(([k,l])=>`<div class=c><b>${l}</b>${C[k]?`<br><img src="${C[k]}" width=120>`:''}<input type="file" id="i_${k}" accept="image/*"><button onclick="saveI('${k}')">Upload</button></div>`).join('')}
async function act(action,table,id){await fetch('/api/admin',{method:'POST',headers:H(),body:JSON.stringify({action,table,id})});load()}
async function likes(ids){for(const id of ids)await act('approve','likes',id)}
async function rep(id){await fetch('/api/admin',{method:'POST',headers:H(),body:JSON.stringify({action:'reply',id,text:document.getElementById('r'+id).value})});load()}
async function saveT(key){await fetch('/api/admin',{method:'POST',headers:H(),body:JSON.stringify({action:'setcontent',key,value:document.getElementById('t_'+key).value})});alert('Saved')}
async function saveI(k){const f=document.getElementById('i_'+k).files[0];if(!f)return;const d=new FormData();d.append('contentKey',k);d.append('media',await shrink(f));const r=await fetch('/api/admin',{method:'POST',headers:H(),body:d});alert(r.ok?'Photo updated':'Failed');load()}
f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);for(const x of media.files){if(x.size>4e6&&!x.type.startsWith('image/')){alert('File too large. Use a YouTube link.');return}d.append('media',await shrink(x))}const r=await fetch('/api/admin',{method:'POST',headers:H(),body:d});alert(r.ok?'Posted':'Failed');f.reset()};
if(sessionStorage.k)load();
</script></body></html>
